# Render.com Blueprint — one-click deploy for the entire app
# (backend + frontend served from same Express server)
services:
  - type: web
    name: caretrack-mrms
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false        # SET MANUALLY: paste your Railway/Aiven MySQL URL
      - key: DB_SSL
        value: "true"
